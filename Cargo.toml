[package]
name = "dashe"
version = "0.36.0"
edition = "2021"
authors = ["Rüdiger Klaehn <rklaehn@protonmail.com>", "n0 team"]
keywords = ["scp", "sftp", "network", "p2p", "holepunching"]
categories = ["network-programming"]
license = "MIT"
repository = "https://github.com/n0-computer/dashe"
description = "A cli tool to send directories over the network, with NAT hole punching"
readme = "README.md"

# Sadly this also needs to be updated in .github/workflows/ci.yml
rust-version = "1.91"

[[bin]]
name = "dshe"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.75"
clap = { version = "4.4.10", features = ["derive"] }
console = "0.16"
futures-buffered = "0.2.11"
indicatif = "0.18"
iroh-blobs = { version = "0.103" }
iroh = { version = "1.0.0", default-features = false, features = ["tls-ring", "portmapper", "fast-apple-datapath"] }
tokio = { version = "1.34.0", features = ["full"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
walkdir = "2.4.0"
n0-future = "0.3"
hex = "0.4.3"
qrcode = { version = "0.14", default-features = false }
tar = "0.4"
flate2 = "1"
socket2 = "0.5"
crossterm = { version = "0.29.0", features = [
  "event-stream",
  "osc52",
], optional = true }
irpc = "0.17.0"

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.174", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"], optional = true }

[dev-dependencies]
duct = "1.1"
nix = { version = "0.31", features = ["signal", "process"] }
serde_json = "1.0.108"
tempfile = "3.8.1"

[features]
clipboard = ["dep:crossterm", "dep:windows-sys", "dep:libc"]
default = ["clipboard"]

[profile.release]
panic = "abort"
opt-level = "s"
codegen-units = 1
lto = true
debug = "none"
strip = true
